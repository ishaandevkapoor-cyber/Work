name: jobpoll

on:
  schedule:
    # 06:00 London is 05:00 UTC in summer (BST) and 06:00 UTC in winter (GMT).
    # Both slots fire; the "gate" step lets only the one that is 06:00 London through.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | resolve | resolve-all"
        default: "run"
      only:
        description: "optional: poll only employers whose name contains this text"
        default: ""

permissions:
  contents: write

concurrency:
  group: jobpoll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Gate on 06:00 London
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/London date +%H)" = "06" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 06:00 London; skipping this slot."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ github.ref_name }}   # branch tip at job start, not the commit that queued the run

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Poll
        if: steps.gate.outputs.go == 'true'
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          ONLY="${{ github.event.inputs.only }}"
          case "$MODE" in
            dry-run)     python jobpoll.py --dry-run -vv ${ONLY:+--only "$ONLY"} ;;
            resolve)     python jobpoll.py --resolve --verbose ;;
            resolve-all) python jobpoll.py --resolve-all --verbose ;;
            *)           set -o pipefail; python jobpoll.py --verbose | tee summary.txt | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Commit state and report
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "jobpoll[bot]"
          git config user.email "jobpoll@users.noreply.github.com"
          git add -A seen.json targets.json reports/
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            SUMMARY="$(tail -n1 summary.txt 2>/dev/null | sed 's/ ->.*//')"
            git commit -m "jobpoll: $(date -u +%Y-%m-%d) ${SUMMARY:-state update}"
            # seen.json merges as a union and report rows append (see .gitattributes), so a
            # commit that landed on main while we were polling never blocks this push
            git config merge.jsonunion.driver "python3 merge_seen.py %O %A %B"
            git config merge.jsonunion.name "union of seen.json"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; git merge -m "jobpoll: merge state" "origin/${GITHUB_REF_NAME}"; }
              git push && break
              sleep 10
            done
          fi
